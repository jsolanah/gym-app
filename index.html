<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gym Offline</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=">
<style>
 /* Reset y estilos base CSS puros */
 *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 html, body {
   -webkit-tap-highlight-color: transparent;
   overscroll-behavior-y: contain;
   background-color: #0a0a0a;
   color: #f5f5f5;
   font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
   min-height: 100vh;
   user-select: none;
   -webkit-user-select: none;
 }
 ::-webkit-scrollbar { display: none; }
 body { padding-top: env(safe-area-inset-top); }
 /* Utilidades de animación y efectos */
 .tap-scale { transition: transform 0.1s ease; cursor: pointer; }
 .tap-scale:active { transform: scale(0.94); }
 .fade-in { animation: fadeIn 0.18s ease-out; }
 @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
 @keyframes pulseRing { 0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } }
 .timer-alert { animation: pulseRing 1s infinite; }
 input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
 /* Clases CSS personalizadas */
 .app-container { max-width: 28rem; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
 header { position: sticky; top: 0; z-index: 20; background-color: rgba(10, 10, 10, 0.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid #262626; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.75rem; }
 main { flex: 1; padding: 1rem; padding-bottom: 10rem; }
 .back-btn { background: none; border: none; color: #34d399; font-size: 1.125rem; padding: 0.25rem; cursor: pointer; }
 .back-btn.hidden, .hidden { display: none !important; }
 h1 { font-size: 1.125rem; font-weight: 700; letter-spacing: -0.025em; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 /* Temporizador flotante */
 .rest-timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: 76px; z-index: 30; width: 92%; max-width: 24rem; background-color: #171717; border: 1px solid rgba(5, 150, 105, 0.5); border-radius: 1rem; padding: 0.75rem 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); display: flex; align-items: center; gap: 0.75rem; }
 .rest-ring { width: 3rem; height: 3rem; border-radius: 9999px; background-color: #262626; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #34d399; flex-shrink: 0; }
 /* Navegación inferior */
 nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 28rem; margin: 0 auto; background-color: rgba(23, 23, 23, 0.95); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid #262626; display: flex; justify-content: space-around; padding: 0.5rem 0; padding-bottom: calc(0.4rem + env(safe-area-inset-bottom)); z-index: 20; }
 .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; font-size: 11px; gap: 0.25rem; padding: 0.25rem 0.5rem; cursor: pointer; color: #737373; position: relative; }
 .nav-btn.text-emerald-400 { color: #34d399; }
 .active-dot { position: absolute; top: 0; right: 0.25rem; width: 0.5rem; height: 0.5rem; background-color: #34d399; border-radius: 9999px; }
 /* Tarjetas y componentes */
 .card { background-color: #171717; border: 1px solid #262626; border-radius: 1rem; padding: 1rem; }
 .btn-emerald { background-color: #10b981; color: #030712; font-weight: 700; border: none; border-radius: 1rem; padding: 0.75rem 1rem; width: 100%; cursor: pointer; text-align: center; font-size: 0.95rem; }
 .btn-secondary { background-color: #262626; color: #d4d4d4; font-weight: 600; border: none; border-radius: 1rem; padding: 0.75rem 1rem; cursor: pointer; text-align: center; }
 .btn-danger { background-color: #450a0a; border: 1px solid #991b1b; color: #f87171; font-weight: 600; border-radius: 1rem; padding: 0.65rem 1rem; width: 100%; cursor: pointer; }
 .input-field { width: 100%; background-color: #262626; border: 1px solid #404040; border-radius: 0.75rem; padding: 0.65rem 0.75rem; font-size: 0.875rem; color: #f5f5f5; outline: none; }
 .input-field:focus { border-color: #059669; }
 .set-input { width: 3.25rem; background: transparent; border: 1px solid transparent; border-radius: 0.4rem; color: #f5f5f5; font: inherit; font-size: 0.875rem; font-weight: 700; line-height: 1; padding: 0.2rem; text-align: center; outline: none; user-select: text; -webkit-user-select: text; }
 .set-input:focus { background: #262626; border-color: #059669; }
 .flex { display: flex; }
 .flex-1 { flex: 1; }
 .items-center { align-items: center; }
 .justify-between { justify-content: space-between; }
 .justify-center { justify-content: center; }
 .gap-1 { gap: 0.25rem; } .gap-2 { gap: 0.5rem; } .gap-3 { gap: 0.75rem; } .gap-4 { gap: 1rem; }
 .space-y-2 > * + * { margin-top: 0.5rem; }
 .space-y-3 > * + * { margin-top: 0.75rem; }
 .space-y-4 > * + * { margin-top: 1rem; }
 .text-xs { font-size: 0.75rem; }
 .text-sm { font-size: 0.875rem; }
 .font-semibold { font-weight: 600; }
 .font-bold { font-weight: 700; }
 .text-neutral-400 { color: #a3a3a3; }
 .text-neutral-500 { color: #737373; }
 .text-emerald-400 { color: #34d399; }
 .text-red-400 { color: #f87171; }
 .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
 .w-full { width: 100%; }
</style>
</head>
<body>
<div id="app" class="app-container">
<header>
<button id="backBtn" class="back-btn hidden">←</button>
<h1 id="headerTitle">🏋️ Rutinas</h1>
</header>
<main id="mainView" class="fade-in"></main>
<!-- Temporizador de descanso flotante -->
<div id="restTimer" class="rest-timer hidden">
<div id="restRing" class="rest-ring">--</div>
<div class="flex-1">
<div class="text-xs text-neutral-400">Descanso</div>
<div class="text-sm font-semibold">Prepárate para la siguiente serie</div>
</div>
<button id="restMinus15" class="tap-scale btn-secondary" style="padding: 0.35rem 0.5rem; font-size: 0.75rem;">-15s</button>
<button id="restSkip" class="tap-scale" style="background: #10b981; color: #030712; font-size: 0.75rem; font-weight: 700; padding: 0.4rem 0.6rem; border-radius: 0.5rem; border:none; cursor:pointer;">Saltar</button>
</div>
<nav id="bottomNav">
<button data-tab="rutinas" class="nav-btn tap-scale">
<span style="font-size: 1.25rem;">📅</span> Rutinas
</button>
<button data-tab="entrenar" class="nav-btn tap-scale">
<span style="font-size: 1.25rem;">▶️</span> Entrenar
<span id="activeDot" class="active-dot hidden"></span>
</button>
<button data-tab="historial" class="nav-btn tap-scale">
<span style="font-size: 1.25rem;">📊</span> Historial
</button>
<button data-tab="ejercicios" class="nav-btn tap-scale">
<span style="font-size: 1.25rem;">📚</span> Ejercicios
</button>
</nav>
</div>
<script>
/* =========================================================
  DATOS: biblioteca de ejercicios
  ========================================================= */
const EXERCISES = [
 { id:'press_banca', name:'Press de banca', muscle:'Pecho', desc:'Espalda apoyada en el banco, baja la barra al pecho con control y empuja sin bloquear los codos.' },
 { id:'press_inclinado', name:'Press de banca inclinado', muscle:'Pecho', desc:'Banco inclinado, baja la barra o mancuernas al pecho superior con control.' },
 { id:'aperturas', name:'Cristos', muscle:'Pecho', desc:'Aperturas con mancuernas o poleas, brazos semiflexionados abriendo en arco.' },
 { id:'triceps_polea', name:'Extensión de tríceps', muscle:'Tríceps', desc:'Codos pegados al cuerpo, extiende el antebrazo hacia abajo en la polea.' },
 { id:'triceps_tumbado', name:'Extensión de tríceps tumbado con barra Z', muscle:'Tríceps', desc:'Tumbado en banco, baja la barra Z hacia la frente flexionando los codos.' },
 { id:'sentadilla', name:'Sentadillas', muscle:'Piernas', desc:'Barra en trapecio, baja con espalda recta y rodillas alineadas con los pies.' },
 { id:'prensa', name:'Prensa de pierna inclinada', muscle:'Piernas', desc:'Pies en la plataforma, baja sin despegar la zona lumbar del respaldo.' },
 { id:'extension_piernas', name:'Extensión de piernas', muscle:'Piernas', desc:'Sentado en máquina, eleva las piernas contrayendo los cuádriceps.' },
 { id:'curl_piernas', name:'Curl de piernas acostado', muscle:'Piernas', desc:'Tumbado boca abajo en máquina, flexiona las piernas elevando el peso con los femorales.' },
 { id:'elevacion_talones', name:'Elevación de talones en pie', muscle:'Piernas', desc:'De pie sobre soporte, eleva los talones contrayendo los gemelos.' },
 { id:'press_militar', name:'Press militar sentado', muscle:'Hombros', desc:'Sentado, empuja la barra o mancuernas por encima de la cabeza sin arquear la espalda.' },
 { id:'remo_barra', name:'Press con barra', muscle:'Hombros', desc:'Movimiento de press o empuje con barra con control técnico.' },
 { id:'jalon_pecho', name:'Jalón al pecho', muscle:'Espalda', desc:'Tira de la barra hacia la parte alta del pecho en polea alta.' },
 { id:'jalon_cerrado', name:'Jalón con agarre cerrado', muscle:'Espalda', desc:'Jalón en polea alta utilizando un agarre estrecho para enfocar la espalda media.' },
 { id:'remo_polea', name:'Remo', muscle:'Espalda', desc:'Espalda recta, tira del agarre hacia el abdomen manteniendo el torso fijo.' },
 { id:'curl_biceps', name:'Curl de biceps en polea', muscle:'Bíceps', desc:'Codos fijos junto al torso, realiza el curl utilizando la polea baja.' },
 { id:'curl_martillo', name:'Curl martillo', muscle:'Bíceps', desc:'Agarre neutro con mancuernas, sube controlando la bajada.' },
 { id:'plancha', name:'Plancha Abdominal', muscle:'Core', desc:'Apoyo en antebrazos y pies, cuerpo en línea recta, mantén activando el core.' },
 { id:'abdominales', name:'Abdominales (Crunch)', muscle:'Core', desc:'Tumbado boca arriba, eleva el torso contrayendo el abdomen y baja controlado.' },
 { id:'elevacion_piernas', name:'Elevación de Piernas', muscle:'Core', desc:'Tumbado boca arriba, eleva las piernas rectas y baja sin tocar el suelo.' }
];
const MUSCLES = ['Pecho','Espalda','Piernas','Hombros','Bíceps','Tríceps','Core'];
const MUSCLE_EMOJI = { 'Pecho':'🏋️', 'Espalda':'🦾', 'Piernas':'🦵', 'Hombros':'🤸', 'Bíceps':'💪', 'Tríceps':'💪', 'Core':'🔥' };
const allExercises = () => EXERCISES.concat(state.customExercises).map(ex =>
 state.nameOverrides[ex.id] ? { ...ex, name: state.nameOverrides[ex.id] } : ex
);
const exById = id => allExercises().find(e => e.id === id);
function exThumbHtml(ex, sizeStyle = 'width:3.5rem; height:3.5rem;') {
 return `<div style="${sizeStyle} border-radius:0.75rem; background:linear-gradient(135deg, #1f2937, #111827); border:1px solid #374151; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
<span style="font-size:1.25rem; line-height:1;">${MUSCLE_EMOJI[ex.muscle] || '🏃'}</span>
<span style="font-size:9px; color:#34d399; font-weight:bold; margin-top:2px; max-width:95%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${ex.muscle}</span>
</div>`;
}
const DEFAULT_ROUTINES = [
 { id:'dia1', name:'Día 1 · Pecho / Tríceps', emoji:'💪', exerciseIds:['press_banca','press_inclinado','aperturas','triceps_polea'] },
 { id:'dia2', name:'Día 2 · Espalda / Bíceps', emoji:'🏋️', exerciseIds:['remo_barra','jalon_pecho','curl_biceps','curl_martillo'] },
 { id:'dia3', name:'Día 3 · Piernas / Hombros', emoji:'🦵', exerciseIds:['sentadilla','prensa','press_militar'] },
 { id:'dia4', name:'Día 4 · Core / Full Body', emoji:'🔥', exerciseIds:['remo_polea','plancha','abdominales','elevacion_piernas'] },
];
const routineById = id => state.routines.find(r => r.id === id);
const DEFAULT_SETS = 3, DEFAULT_REPS = 10, DEFAULT_WEIGHT = 20, REST_SECONDS = 90;
const STORAGE_KEY = 'gymoffline_data_v10';
function loadData() {
 try {
   const raw = localStorage.getItem(STORAGE_KEY);
   if (raw) return JSON.parse(raw);
 } catch (e) {}
 return { activeSession: null, history: [], lastPerformance: {}, routines: null };
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
let state = loadData();
if (!state.history) state.history = [];
if (!state.lastPerformance) state.lastPerformance = {};
if (!state.restTimer) state.restTimer = null;
if (!state.routines || !state.routines.length) state.routines = JSON.parse(JSON.stringify(DEFAULT_ROUTINES));
if (!state.customExercises) state.customExercises = [];
if (!state.nameOverrides) state.nameOverrides = {};
/* Audio con Web Audio API */
let audioCtx = null;
function beep(freq = 880, dur = 0.15) {
 try {
   audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
   const osc = audioCtx.createOscillator();
   const gain = audioCtx.createGain();
   osc.frequency.value = freq;
   osc.type = 'sine';
   gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
   gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
   osc.connect(gain).connect(audioCtx.destination);
   osc.start();
   osc.stop(audioCtx.currentTime + dur);
 } catch (e) {}
}
/* Temporizador de descanso */
const restTimerEl = document.getElementById('restTimer');
const restRing = document.getElementById('restRing');
let restInterval = null;
let restRemaining = 0;
function startRestTimer(seconds = REST_SECONDS) {
 clearInterval(restInterval);
 state.restTimer = { endsAt: Date.now() + seconds * 1000 };
 saveData();
 restTimerEl.classList.remove('hidden');
 updateRestUI();
 scheduleRestTimer();
}
function scheduleRestTimer() {
 clearInterval(restInterval);
 if (!state.restTimer) return;
 if (getRestRemaining() <= 0) {
   finishRestTimer();
   return;
 }
 restTimerEl.classList.remove('hidden');
 restInterval = setInterval(() => {
   updateRestUI();
   if (restRemaining <= 0) finishRestTimer();
 }, 1000);
}
function getRestRemaining() {
 if (!state.restTimer) return 0;
 return Math.max(0, Math.ceil((state.restTimer.endsAt - Date.now()) / 1000));
}
function updateRestUI() {
 restRemaining = getRestRemaining();
 restRing.textContent = restRemaining > 0 ? restRemaining : '0';
 restTimerEl.classList.toggle('timer-alert', restRemaining <= 5);
}
function finishRestTimer() {
 clearInterval(restInterval);
 state.restTimer = null;
 saveData();
 restTimerEl.classList.add('hidden');
 beep(1046, 0.3);
 setTimeout(() => beep(1318, 0.3), 200);
 if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
document.getElementById('restSkip').addEventListener('click', finishRestTimer);
document.getElementById('restMinus15').addEventListener('click', () => {
 if (!state.restTimer) return;
 state.restTimer.endsAt = Math.max(Date.now() + 1000, state.restTimer.endsAt - 15000);
 saveData();
 updateRestUI();
});
document.addEventListener('visibilitychange', () => {
 if (document.hidden) clearInterval(restInterval);
 else scheduleRestTimer();
});
window.addEventListener('pageshow', scheduleRestTimer);
/* Router */
let view = { tab: 'rutinas', dayId: null, exerciseId: null, historyIdx: null };
let renamingRoutineState = false;
let renamingExerciseState = false;
const mainView = document.getElementById('mainView');
const headerTitle = document.getElementById('headerTitle');
const backBtn = document.getElementById('backBtn');
const activeDot = document.getElementById('activeDot');
backBtn.addEventListener('click', () => {
 renamingRoutineState = false;
 renamingExerciseState = false;
 if (view.tab === 'rutinas' && view.dayId && view.exerciseId) view.exerciseId = null;
 else if (view.tab === 'rutinas' && view.dayId) { view.dayId = null; editMode = false; exPicker = { open: false, query: '', muscle: '', creating: false }; }
 else if (view.tab === 'ejercicios' && view.exerciseId) view.exerciseId = null;
 else if (view.tab === 'historial' && view.historyIdx !== null) view.historyIdx = null;
 render();
});
document.querySelectorAll('.nav-btn').forEach(btn => {
 btn.addEventListener('click', () => {
   editMode = false; renamingRoutineState = false; renamingExerciseState = false;
   exPicker = { open: false, query: '', muscle: '', creating: false };
   view = { tab: btn.dataset.tab, dayId: null, exerciseId: null, historyIdx: null };
   render();
 });
});
function render() {
 activeDot.classList.toggle('hidden', !state.activeSession);
 const showBack = (view.tab === 'rutinas' && view.dayId) ||
                  (view.tab === 'ejercicios' && view.exerciseId) ||
                  (view.tab === 'historial' && view.historyIdx !== null);
 backBtn.classList.toggle('hidden', !showBack);
 document.querySelectorAll('.nav-btn').forEach(b => {
   const active = b.dataset.tab === view.tab;
   b.classList.toggle('text-emerald-400', active);
 });
 if (view.tab === 'rutinas') {
   if (view.dayId && view.exerciseId) renderExerciseDetail();
   else if (view.dayId) renderDayDetail();
   else renderRutinas();
 }
 else if (view.tab === 'entrenar') renderEntrenar();
 else if (view.tab === 'historial') view.historyIdx !== null ? renderHistoryDetail() : renderHistorial();
 else if (view.tab === 'ejercicios') view.exerciseId ? renderExerciseDetail() : renderEjercicios();
 mainView.classList.remove('fade-in');
 void mainView.offsetWidth;
 mainView.classList.add('fade-in');
}
/* GESTIÓN DE CLICS SEGURA (COMPATIBLE CON iOS Y SIN BLOQUEOS DE CONFIRM) */
mainView.addEventListener('click', (e) => {
 // 1. Eliminar ejercicio de una rutina
 const removeExBtn = e.target.closest('.removeExBtn');
 if (removeExBtn) {
   e.stopPropagation();
   const day = routineById(view.dayId);
   if (day) {
     day.exerciseIds = day.exerciseIds.filter(id => id !== removeExBtn.dataset.id);
     saveData();
     render();
   }
   return;
 }
 // 2. Eliminar rutina entera
 const deleteRoutineBtn = e.target.closest('#deleteRoutineBtn');
 if (deleteRoutineBtn) {
   const day = routineById(view.dayId);
   if (day) {
     state.routines = state.routines.filter(r => r.id !== day.id);
     saveData();
     editMode = false; view.dayId = null;
     render();
   }
   return;
 }
 // 3. Vaciar historial completo
 const clearHistoryBtn = e.target.closest('#clearHistoryBtn');
 if (clearHistoryBtn) {
   state.history = [];
   saveData();
   render();
   return;
 }
 // 4. Eliminar entrada individual del historial (desde la lista)
 const delHistCardBtn = e.target.closest('.delHistCardBtn');
 if (delHistCardBtn) {
   e.stopPropagation();
   state.history.splice(+delHistCardBtn.dataset.idx, 1);
   saveData();
   render();
   return;
 }
 // 5. Eliminar entrada individual del historial (desde el detalle)
 const deleteHistEntryBtn = e.target.closest('#deleteHistEntryBtn');
 if (deleteHistEntryBtn) {
   state.history.splice(view.historyIdx, 1);
   saveData();
   view.historyIdx = null;
   render();
   return;
 }
 // 6. Eliminar ejercicio personalizado de la biblioteca
 const deleteCustomExBtn = e.target.closest('#deleteCustomExBtn');
 if (deleteCustomExBtn) {
   const ex = exById(view.exerciseId);
   if (ex) {
     state.customExercises = state.customExercises.filter(e => e.id !== ex.id);
     state.routines.forEach(day => { day.exerciseIds = day.exerciseIds.filter(id => id !== ex.id); });
     saveData();
     view.exerciseId = null;
     render();
   }
   return;
 }
 // 7. Abrir detalle de ejercicio en rutina
 const dayExRow = e.target.closest('.dayExRow');
 if (dayExRow) {
   view.exerciseId = dayExRow.dataset.id;
   render();
   return;
 }
 // 8. Abrir tarjeta de historial
 const histCard = e.target.closest('.histCard');
 if (histCard) {
   view.historyIdx = +histCard.dataset.idx;
   render();
   return;
 }
 // 9. Abrir tarjeta de ejercicio
 const exCard = e.target.closest('.exCard');
 if (exCard) {
   view.exerciseId = exCard.dataset.ex;
   render();
   return;
 }
});
/* Rutinas */
const uid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function renderRutinas() {
 headerTitle.textContent = '🏋️ Mis Rutinas';
 mainView.innerHTML = `
<div class="text-xs text-neutral-500 flex items-center gap-1.5" style="margin-bottom: 0.75rem;">
<span>☰</span> Mantén pulsado el icono y arrastra para reordenar tus rutinas.
</div>
<div id="routineList" class="space-y-3">
     ${state.routines.map(day => `
<div class="dayCard card flex items-center gap-2 tap-scale" data-id="${day.id}" style="display:flex; align-items:center;">
<button class="dragHandle tap-scale text-neutral-500" style="background:none; border:none; font-size:1.25rem; padding:0.5rem; cursor:grab; touch-action:none;" aria-label="Reordenar">☰</button>
<button class="dayOpenBtn flex-1 truncate" data-day="${day.id}" style="background:none; border:none; text-align:left; color:inherit; cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
<div>
<div style="font-size:1.5rem; margin-bottom:0.25rem;">${day.emoji}</div>
<div class="font-semibold text-sm truncate">${day.name}</div>
<div class="text-xs text-neutral-500" style="margin-top:0.25rem;">${day.exerciseIds.length} ejercicios</div>
</div>
<span class="text-neutral-500" style="font-size:1.25rem;">›</span>
</button>
</div>
     `).join('')}
</div>
<div id="newRoutineContainer" style="margin-top:0.75rem;">
<button id="newRoutineBtn" class="tap-scale w-full" style="background:#171717; border:1px dashed #404040; color:#34d399; font-weight:600; padding:1rem; border-radius:1rem; cursor:pointer;">+ Nueva rutina</button>
</div>
 `;
 mainView.querySelectorAll('.dayOpenBtn').forEach(el => {
   el.addEventListener('click', () => { view.dayId = el.dataset.day; render(); });
 });
 enableRoutineDrag();
 document.getElementById('newRoutineBtn').addEventListener('click', () => {
   const container = document.getElementById('newRoutineContainer');
   container.innerHTML = `
<div class="card space-y-2">
<div class="text-xs font-semibold text-emerald-400">NUEVA RUTINA</div>

function enableRoutineDrag() {
 const list = document.getElementById('routineList');
 if (!list) return;
 list.querySelectorAll('.dragHandle').forEach(handle => {
   handle.addEventListener('pointerdown', (e) => {
     e.preventDefault();
     const dragEl = handle.closest('.dayCard');
     dragEl.style.opacity = '0.7';
     dragEl.style.borderColor = '#10b981';
     const onMove = (ev) => {
       const siblings = Array.from(list.querySelectorAll('.dayCard')).filter(c => c !== dragEl);
       let inserted = false;
       for (const sib of siblings) {
         const box = sib.getBoundingClientRect();
         if (ev.clientY < box.top + box.height / 2) {
           list.insertBefore(dragEl, sib);
           inserted = true;
           break;
         }
       }
       if (!inserted) list.appendChild(dragEl);
     };
     const onUp = () => {
       document.removeEventListener('pointermove', onMove);
       document.removeEventListener('pointerup', onUp);
       dragEl.style.opacity = '1';
       dragEl.style.borderColor = '#262626';
       const newOrderIds = Array.from(list.querySelectorAll('.dayCard')).map(c => c.dataset.id);
       state.routines.sort((a, b) => newOrderIds.indexOf(a.id) - newOrderIds.indexOf(b.id));
       saveData();
     };
     document.addEventListener('pointermove', onMove);
     document.addEventListener('pointerup', onUp);
   });
 });
}

function finishSession() {
 const s = state.activeSession;
 const durationSec = Math.floor((Date.now() - s.startedAt) / 1000);
 let totalVolume = 0;
 s.exercises.forEach(ex => {
   ex.sets.forEach(set => { totalVolume += set.weight * set.reps; });
   const lastSet = ex.sets[ex.sets.length - 1];
   state.lastPerformance[ex.exerciseId] = { weight: lastSet.weight, reps: lastSet.reps, date: new Date().toISOString() };
 });
 state.history.unshift({
   date: new Date().toISOString(),
   dayName: s.dayName,
   durationSec,
   totalVolume: Math.round(totalVolume),
   exercises: s.exercises.map(ex => ({
     exerciseId: ex.exerciseId, name: ex.name,
     sets: ex.sets.map(({ weight, reps }) => ({ weight, reps }))
   }))
 });
 if (state.history.length > 200) state.history.length = 200;
 clearInterval(window.__elapsedInterval);
 clearInterval(restInterval);
 state.restTimer = null;
 restTimerEl.classList.add('hidden');
 state.activeSession = null;
 saveData();
 view = { tab: 'historial', dayId: null, exerciseId: null, historyIdx: 0 };
 render();
}

<div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:0.5rem;">
<div class="card" style="padding:0.75rem; text-align:center;">
<div class="font-bold" style="font-size:1rem;">${d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' })}</div>
<div class="text-xs text-neutral-500" style="font-size:10px;">Fecha</div>
</div>
<div class="card" style="padding:0.75rem; text-align:center;">
<div class="font-bold" style="font-size:1rem;">${Math.floor(h.durationSec/60)} min</div>
<div class="text-xs text-neutral-500" style="font-size:10px;">Duración</div>
</div>
<div class="card" style="padding:0.75rem; text-align:center;">
<div class="font-bold" style="font-size:1rem;">${h.totalVolume}</div>
<div class="text-xs text-neutral-500" style="font-size:10px;">Volumen (kg)</div>
</div>
</div>
<div class="space-y-2">
       ${h.exercises.map(ex => `
<div class="card">
<div class="font-semibold text-sm" style="margin-bottom:0.5rem;">${ex.name}</div>
<div class="flex" style="flex-wrap:wrap; gap:0.5rem;">
             ${ex.sets.map((s, i) => `<span class="text-xs" style="background:#262626; border-radius:9999px; padding:0.25rem 0.6rem;">S${i+1}: ${s.weight}kg × ${s.reps}</span>`).join('')}
</div>
</div>
       `).join('')}
</div>
<button id="deleteHistEntryBtn" class="tap-scale btn-danger">🗑 Eliminar entrenamiento</button>
</div>
 `;
}
/* Ejercicios */
let exFilter = { query: '', muscle: null };
let creatingLibraryExercise = false;
function renderEjercicios() {
 headerTitle.textContent = '📚 Ejercicios';
 mainView.innerHTML = `
<div class="space-y-3">
<input id="exSearch" type="text" placeholder="Buscar ejercicio..." value="${exFilter.query}" class="input-field">
<div class="flex" style="flex-wrap:wrap; gap:0.35rem;">
<button class="chip tap-scale text-xs font-semibold" data-muscle="" style="background:${!exFilter.muscle ? '#10b981' : '#262626'}; color:${!exFilter.muscle ? '#030712' : '#d4d4d4'}; border:none; padding:0.35rem 0.75rem; border-radius:9999px; cursor:pointer;">Todos</button>
       ${MUSCLES.map(m => `<button class="chip tap-scale text-xs font-semibold" data-muscle="${m}" style="background:${exFilter.muscle === m ? '#10b981' : '#262626'}; color:${exFilter.muscle === m ? '#030712' : '#d4d4d4'}; border:none; padding:0.35rem 0.75rem; border-radius:9999px; cursor:pointer;">${m}</button>`).join('')}
</div>
     ${creatingLibraryExercise ? `<div class="card">${renderNewExerciseForm('libNew')}</div>` : `<button id="libCreateBtn" class="tap-scale w-full" style="background:#171717; border:1px dashed #404040; color:#34d399; font-weight:bold; font-size:0.875rem; padding:0.75rem; border-radius:0.75rem; cursor:pointer;">+ Crear ejercicio nuevo</button>`}
<div id="exGrid" class="space-y-2"></div>
</div>
 `;
 if (creatingLibraryExercise) {
   bindNewExerciseForm('libNew', {
     onCreate: () => { creatingLibraryExercise = false; render(); },
     onCancel: () => { creatingLibraryExercise = false; render(); }
   });
 } else {
   document.getElementById('libCreateBtn').addEventListener('click', () => { creatingLibraryExercise = true; render(); });
 }
 renderExGrid();
 document.getElementById('exSearch').addEventListener('input', (e) => {
   exFilter.query = e.target.value;
   renderExGrid();
 });
 mainView.querySelectorAll('.chip').forEach(btn => {
   btn.addEventListener('click', () => {
     exFilter.muscle = btn.dataset.muscle || null;
     renderEjercicios();
   });
 });
}
function renderExGrid() {
 const grid = document.getElementById('exGrid');
 const q = exFilter.query.trim().toLowerCase();
 const filtered = allExercises().filter(ex =>
   (!exFilter.muscle || ex.muscle === exFilter.muscle) &&
   (!q || ex.name.toLowerCase().includes(q))
 );
 if (!filtered.length) {
   grid.innerHTML = `<div style="text-align:center; color:#737373; margin-top:2rem; font-size:0.875rem;">No se encontraron ejercicios.</div>`;
   return;
 }
 grid.innerHTML = filtered.map(ex => `
<button class="exCard card tap-scale w-full" data-ex="${ex.id}" style="width:100%; text-align:left; display:flex; align-items:center; gap:0.75rem; background:#171717; border:1px solid #262626; border-radius:1rem; padding:0.75rem; cursor:pointer;">
     ${exThumbHtml(ex, 'width:3.5rem; height:3.5rem;')}
<div class="flex-1 truncate">
<div class="font-semibold text-sm truncate" style="color:#f5f5f5;">${ex.name}${ex.custom || String(ex.id).startsWith('custom_') ? ' <span class="text-xs text-neutral-500">(propio)</span>' : ''}</div>
<div class="text-xs text-emerald-400" style="margin-top:0.125rem;">${ex.muscle}</div>
</div>
<span class="text-neutral-500" style="font-size:1.25rem;">›</span>
</button>
 `).join('');
}
function renderExerciseDetail() {
 const ex = exById(view.exerciseId);
 if (!ex) { view.exerciseId = null; render(); return; }
 headerTitle.textContent = ex.name;
 const isUserCustom = Boolean(ex.custom || String(ex.id).startsWith('custom_'));
 const evolution = [];
 state.history.forEach((h) => {
   const found = h.exercises.find(e => e.exerciseId === ex.id);
   if (found) {
     const best = found.sets.reduce((a, b) => (a.weight * a.reps > b.weight * b.reps ? a : b));
     evolution.push({ date: h.date, best });
   }
 });
 mainView.innerHTML = `
<div class="space-y-4">
<div style="border-radius:1rem; overflow:hidden; background:linear-gradient(135deg, #1f2937, #111827); border:1px solid #374151; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:12rem;">
<span style="font-size:4rem; margin-bottom:0.5rem;">${MUSCLE_EMOJI[ex.muscle] || '🏃'}</span>
<span class="text-emerald-400 font-bold text-sm" style="text-transform:uppercase; letter-spacing:0.05em;">${ex.muscle}</span>
</div>
     ${renamingExerciseState ? `
<div class="card space-y-2" style="border-color:#10b981;">
<div class="text-xs font-semibold text-emerald-400">RENOMBRAR EJERCICIO</div>
<input id="renameExInput" type="text" value="${ex.name}" class="input-field">
<div class="flex gap-2">
<button id="confirmRenameEx" class="tap-scale btn-emerald" style="padding:0.4rem 0.75rem; font-size:0.8rem;">Guardar</button>
<button id="cancelRenameEx" class="tap-scale btn-secondary" style="padding:0.4rem 0.75rem; font-size:0.8rem;">Cancelar</button>
</div>
</div>
     ` : `<button id="renameExBtn" class="tap-scale btn-secondary w-full">✏️ Renombrar ejercicio</button>`}
<div class="card">
<div class="text-xs font-semibold text-emerald-400" style="text-transform:uppercase; margin-bottom:0.25rem;">Técnica${isUserCustom ? ' · Propio' : ''}</div>
<p class="text-sm text-neutral-400" style="line-height:1.5;">${ex.desc}</p>
</div>
<div>
<h2 class="text-xs font-semibold text-neutral-400" style="text-transform:uppercase; margin-bottom:0.5rem;">Evolución</h2>
       ${evolution.length ? `
<div class="space-y-2">
           ${evolution.slice(0, 8).map(e => {
             const d = new Date(e.date);
             return `<div class="card" style="padding:0.75rem; display:flex; align-items:center; justify-content:space-between;">
<span class="text-xs text-neutral-500">${d.toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' })}</span>
<span class="text-sm font-semibold">${e.best.weight}kg × ${e.best.reps}</span>
</div>`;
           }).join('')}
</div>` : `<div class="text-sm text-neutral-500">Todavía no tienes registros.</div>`}
</div>
     ${isUserCustom ? `<button id="deleteCustomExBtn" class="tap-scale btn-danger">🗑 Eliminar ejercicio</button>` : ''}
</div>
 `;
 const renameExBtn = document.getElementById('renameExBtn');
 if (renameExBtn) {
   renameExBtn.addEventListener('click', () => {
     renamingExerciseState = true;
     render();
   });
 }
 const confirmRenameEx = document.getElementById('confirmRenameEx');
 if (confirmRenameEx) {
   confirmRenameEx.addEventListener('click', () => {
     const val = document.getElementById('renameExInput').value.trim();
     if (val) {
       if (isUserCustom) {
         const customObj = state.customExercises.find(e => e.id === ex.id);
         if (customObj) customObj.name = val;
       } else {
         state.nameOverrides[ex.id] = val;
       }
       saveData();
     }
     renamingExerciseState = false;
     render();
   });
   document.getElementById('cancelRenameEx').addEventListener('click', () => {
     renamingExerciseState = false;
     render();
   });
 }
}
render();
</script>
</body>
</html>
